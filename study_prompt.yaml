Introduction:
  You will be provided with a research paper and your task is to determine specific details on the study.

  You are expected to produce as output a JSON object **and nothing else**. For each question, it is stated what keys you are expected to produce inside this JSON.

- Meta: |
  Write in this key a JSON structure with:
  - "title": The title of the paper
  - "authors": A list with the names of the authors
  - "year": The year of publication
  - "venue": The name of the venue (Conference or Journal, if not present name the publisher).

- Research Questions: |
  A research question is a motivation to conduct a certain angle of investigation in the study; it informs the reader why the authors find a topic important and what potential problems they may solve or what potential benefits may arise from a solution.
  - A research question may be formatted as a problem description that the authors wish to solve or improve upon.
  - A research question is **concise**; it is a statement that aptly captures the motivation of the research.
  - A research question is **explorative**; it does not expect a specific outcome or answer.
  - A research question is **distinguished**; it has little or no overlap with other research questions.
  - A research question may be **dividable**; it can be split into multiple subquestions that are **closely** related.

  Determine the paper's **research questions**, using exact phrasing or close lexical variants. 
  Research questions are often found in **the beginning of the paper**; in the abstract, introduction and background (section 1 and 2). If it is at the end of paper, it is usually either a suggested question for future research or a restatement of an existing question.
  Research questions that are not **answered** in the paper are future research directions and should **not** be included here.

  **Explicit Research Questions**
  - Studies may explicitly state the research questions in their work. However, if the question has an expected outcome this is not considered part of the research question. 

  **Implied Research Questions**
  - This can often be found in the abstract, introduction or background where the authors explain the problem or phenomenon they investigate and motivate it.
  - Then it is implied that they aim to acquire new information on this subject.
  - It is in this case your task to find the latent representation of the research question.
  - Note that in this case the question still **does not** have an expected outcome.

  Your answer will be expected in the following format:
  Studies always have at least one research question, but there can be multiple. For each research question found; add a key to your JSON answer, named research_question_n, where n is the number of the research question. The value is another JSON object with the following key value pairs;
  - If an explicit research question was found, add a key to your JSON answer "explicit" with value True, otherwise False.
  - Add a key to your JSON answer "value" with a string value that is the research question found.
  - Leave your reasoning in the "reason" key of the JSON; Here you state which parts of the paper you base your answer on, referring to specific pages and/or sections.

- Hypotheses: |
  A hypothesis is a logical statement that is expected to be true, and is the main aim of investigation of a study. It has the following properties:
  - A hypothesis must be **falsifiable** i.e. there exists a logical statement describing an observation that contradicts it.
  - A hypothesis must be **testable**, i.e. a hypothesis can be tested by an experiment.
  - A hypothesis in empirical research must be **quantifiable**, e.g. the authors use a metric to measure and produce an outcome with which the hypothesis can be tested
  - A hypothesis can contain **multiple clauses** that are **closely related**, i.e. a hypothesis can contain multiple claims in a single statement that can be tested seperately.
  - A hypothesis is **concise**; It is a strong statement that aptly describes the foundation of the research.

  Determine the paper's **hypotheses**, using exact phrasing or close lexical variants. This can be **explicit** or **implied**. Studies do not always have an hypothesis; in this case the study is purely exploratory.

  **Explicit Hypothesis**
  - If the paper states something like "We hypothesise" or "Our hypothesis is" this is considered an explicit statement.
  - This also includes explicit statements of their **research question** if they specify what they expect the outcome to be.

  **Implied Hypothesis**
  - This can often be found seperated by inspecting the abstract or introduction, where the authors first describe the problem they aim to solve, and propose an improved solution to. 
  - Then it is implied that they hypothesise that their proposed method excels at solving the problem for certain objective.
  - For the expected outcome, this can either be found with the problem description, or at the end of the paper in the discussion or conclusion sections. However, it may be possible that this is found elsewhere in the paper.
  - If the paper only states vague things such as, "We aim to study ..." or "We aim to investigate.." without an expected outcome, this is not a hypothesis, but only a research question and you will need more information to construct the hypothesis from this.

  Your answer will be expected in the following format:
  Papers can have one or more hypothesis. For each hypothesis found; add a key to your JSON answer, named hypothesis_n, where n is the number of the hypothesis. The value is another JSON object with the following values;
  - If an explicit hypothesis was found, add a key to your JSON answer "explicit" with value True, otherwise False.
  - Add a key to your JSON answer "value" with a string value where you either cite the paper for an explicit hypothesis; if the hypothesis is implied **phrase the hypothesis explictly** with a sentence starting "The authors hypothesise that.."
  - The hypothesis must be linked to one or more research questions; provide the keys of the questions that is linked to this hypothesis.
  - Leave your reasoning in the "reason" key of the JSON; Here you state which parts of the paper you base your answer on, referring to specific pages and/or sections.

- Experiments: |
  Determine whether the paper clearly states **how research questions are to be answered** or **how the hypothesis is to be empirically tested**, using exact phrasing or close lexical variants.

  For each experiment, provide a key in the JSON, called experiment_m, where m is the id of the experiment, and inside this key provide a JSON structure with the following information:
  - "research_questions": A list of research question IDs that this experiment is used for. This must not be empty.
  - "hypotheses": A list of hypothesis IDs that this experiment is used for. This may be empty for (fully) exploratory experiments. If the hypothesis has links to research questions that were not added to the previous key, please include them there as well.
  - "experiment_description": A description of the experiment being conducted with relation to the research questions / hypotheses.
  - "strategy": What is the strategy applied to the data to produce the outcome and possible parameters and their values, for example "K-fold cross-validation (k = 10)". For datasets or synthetic datasets / synthetic data generators this often means a splitting strategy (not required), but for simulation environments there is usually some stopping criterion such as a budget. In case the strategy is only a split between training and test set (And possible validation split), state "Random split" with the proportions between brackets (e.g. "Random split (train = 0.8, validation = 0.0, test = 0.2)").
  - "data": The list of what **input** data the authors use for the experiment. This can be datasets used or data simulators such as synthetic data generators or simulation environments. Summarise the names as a list with possible citations between brackets (e.g. "MNIST (LeCun et al. 1998)", ...). In case it is defined or introduced in this work, simply state "(This work)" as a citation.

- Analyses: |
  Based on your answers from the previous questions and the paper, determine for each analysis of each experiment.

  For each analysis, provide a key in the JSON, called analysis_n, where n is the id of the analysis, and inside this key provide a JSON structure with the following information:
  - "experiments": The list of experiment IDs this analysis is based on. This must have at least one value.
  - "reason": A short description of the analysis and its purpose.
  - "metrics": The list of metrics used for the measurements and testing.
  - "statistics": Specifying what kind of statistics are reported on (for example mean with standard deviations / confidence intervals, or median with quantiles, ..) as a list.
  - "test": The tests used to determine differences between outcomes. This can be a simple comparison (e.g. greater than, less than), in which case state how this is compared. This can also be statistical test, in which case report the name of the test, with possible parameters names and their values used such as the significance level for the p-value between brackets (e.g. "T-test (p < 0.05)" or "Permutation Test (p < 0.05, permutations = 10000)").
  - "results": |
    The authors will provide their results throughout the paper. Here you state three keys; "Tables", "Figures" and "Text". For each key, provide a JSON structure with the following information: |
    - For each table, state the label of the table (e.g. 'Table 1') as the key under "tables". Here you provide the value "caption" with the caption of the table.
    - For each figure, state the label of the table (e.g. 'Figure 1') as the key under "figures". Here you provide the value "caption" with the caption of the figure.
    - Results may also be found in the text. In this case, state the section where you find this in (e.g. 'Section 1.1') as the key under "text". Here you provide the value "value", with the part of text that states a result.
    - Provide for each value you are specifying (tables, figures or text) a key "reason" where you state your reason why this is linked to this experiment.
      Furthermore, provide lists of "metrics", "statistics", "data" and "test" for each, which are subsets of the previous respective keys.

- Interpretations: |
  Based on your answers from the previous questions and the paper, determine for each analysis of each experiment how these results are interpreted by the authors.

  Add a key to the JSON, named interpretation_k, where k is the id of the interpretation, and inside this key provide a JSON structure with the following information:
  - "analyses": The list of analysis IDs this interpretation is based on. This may not be empty.
  - "value": |
    The authors state their interpretation of the experiment outcome using exact phrasing or close lexical variants.
    Make sure to quote / paraphrase the paper clearly and state which pages or sections you find your answers.    
  - "reason": State why you included this interpretation and linked it to this experiment.

- Conclusions: |
  Based on your answers from the previous questions and the paper, determine how the authors conclude upon their interpretation and how this reflects upon their research questions and hypotheses.

  Add a key to the JSON, named conclusion_k, where k is the id of the conclusion, and inside this key provide a JSON structure with the following information:
  - "interpretations": The list of interpretation IDs this conclusion is based on. This must have at least one value.
  - "research_questions": The list of research question IDs this conclusion is reflecting upon. This may be empty.
  - "hypotheses": The list of hypothesis IDs this conclusion aiming to support or not. This may be empty as well.
  - "support": Whether the authors can accept the hypothesis based on this experiment outcome analysis interpretation. This is a boolean list of boolean following the same order as the list of hypotheses. Empty if the hypotheses list is empty.
  - "value": The reason the authors decide whether to support the hypothesis or how they reflect upon their research question. Specify the arguments provided by the authors to justify their decision. If the authors have results / reasons that contradict the hypothesis or research question, specify these seperately. Make sure to quote / paraphrase the paper clearly and state which pages or sections you find your answers.
  - "reason": State why you included this conclusion and linked it to this experiment.

- Future Work: |
  The authors may suggest possible future research questions and hypotheses, which is often discussed near the end of a paper; especially the **future work section** tends to contain such information.

  Determine the paper's **suggested research questions** and **suggested hypotheses**, using exact phrasing or close lexical variants.

  Your answer will be expected in the following format:
  Add the following keys to the JSON providing a JSON structure with the following information:
  - "Suggested Research Questions": A JSON object of suggested research questions where you generate a key as "suggested_research_question_n", with a JSON object as value that contains the following key value pairs:
    - "conclusions": A list of conclusion IDs this suggested research question is based on. Must have at least one value.
    - "value": The suggested research question.
    - "note": Information on where the authors suggest this research question in the paper.
    - "reason": The reason the authors suggest this research question and why you included this answer.
  - "Suggested Hypotheses": A JSON objected of suggested hypotheses where you generate a key as "suggested_hypothesis_n", with a JSON object as value that contains the following key value pairs:
    - "conclusions": A list of conclusion IDs this suggested hypothesis is based on. Must have at least one value.
    - "value": The suggested hypothesis.
    - "note": information on where the authors suggest this hypothesis in the paper.
    - "reason": The reason the authors suggest this hypothesis and why you included this answer.
